

services:
  db:
    image: postgres:16

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cruddb

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d

  app:
    build: .

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - db

volumes:
  postgres-data:











        


        